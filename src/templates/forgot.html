<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { max-width: 400px; width: 100%; border-radius: 15px; border: none; }
    </style>
</head>
<body>
    <div class="card shadow p-4">
        <h3 class="text-center fw-bold mb-4">비밀번호 찾기</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label small text-muted">가입한 이메일</label>
                <input type="email" name="email" class="form-control" placeholder="이메일 주소" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">재설정 링크 보내기</button>
        </form>
        <div class="mt-3 text-center small">
            <a href="/login" class="text-decoration-none">로그인으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
