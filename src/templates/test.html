    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script>
        {% with msgs = get_flashed_messages() %}
            {% if msgs %}
                {% for m in msgs %}
                    // 세션에서 유저 이름을 가져옴 (없으면 빈 문자열)
                    const userName = "{{ session.get('user', '') }}";

                    if("{{m}}" === "login_success") {
                        // 이름이 있을 경우 이름을 포함하고, 없으면 기본 메시지 출력
                        const welcomeMsg = userName
                            ? `✅ 반가워요, ${userName}님! 로그인이 완료되었습니다.`
                            : "✅ 반가워요! 로그인이 완료되었습니다.";
                        toast(welcomeMsg, "bg-success");
                    }

                    if("{{m}}" === "logged_out_success") {
                        toast("👋 안전하게 로그아웃되었습니다.", "bg-info");
                    }
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
