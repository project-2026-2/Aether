<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Aether</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 15px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card login-card shadow p-4">
        <h3 class="text-center fw-bold mb-4">로그인</h3>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger small py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="아이디" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">로그인</button>
        </form>


        <div class="mt-4 text-center small text-muted">
            계정이 없으신가요? <a href="/register" class="text-decoration-none">회원가입</a>
        </div>

        <div class="mt-2 text-center small text-muted">
            계정을 잃어버리셧나요? <a href="/forgot" class="text-decoration-none">비밀번호 찾기</a>
        </div>
    </div>
</body>
</html>
