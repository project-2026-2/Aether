<!DOCTYPE html>
<html lang="ko" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aether</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <style>
        /* ID 표시 스타일 강조 */
        .user-id-badge {
            font-weight: 700;
            color: var(--accent);
            margin-right: 15px;
            padding: 5px 12px;
            background: rgba(0, 113, 227, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .ani-card { cursor: pointer; }
    </style>
</head>
<body>
    <div class="toast-container position-fixed top-0 end-0 p-3" style="margin-top: 60px; z-index: 1100;">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <nav class="fixed-top-nav">
        <a href="/" style="text-decoration: none; font-weight: 800; color: var(--text); font-size: 1.2rem;">Aether</a>

        <div class="d-flex align-items-center">
            <button id="theme-toggle" class="btn btn-sm btn-outline-secondary me-3" style="border-radius: 20px;">Theme</button>

            {% if session.get('user') %}
                <span class="user-id-badge">👤 {{ session['user'] }}님</span>
                <a href="/logout" class="btn btn-sm btn-danger" style="border-radius: 20px;">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-sm btn-primary" style="border-radius: 20px;">Login</a>
            {% endif %}
            </div>
    </nav>

    <!-- 중복 로드 제거: bootstrap.bundle은 헤더에서 이미 로드되어 있음 -->
    <script>
        {% with msgs = get_flashed_messages() %}
            {% if msgs %}
                {% for m in msgs %}
                    // 세션에서 유저 이름을 가져옴 (없으면 빈 문자열)
                    const userName = "{{ session.get('user', '') }}";

                    if("{{m}}" === "login_success") {
                        // 이름이 있을 경우 이름을 포함하고, 없으면 기본 메시지 출력
                        const welcomeMsg = userName
                            ? `✅ 반가워요, ${userName}님! 로그인이 완료되었습니다.`
                            : "✅ 반가워요! 로그인이 완료되었습니다.";
                        toast(welcomeMsg, "bg-success");
                    }

                    if("{{m}}" === "logged_out_success") {
                        toast("👋 안전하게 로그아웃되었습니다.", "bg-info");
                    }
                {% endfor %}
            {% endif %}
        {% endwith %}
    </script>
</body>
</html>
