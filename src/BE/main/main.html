<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>

<!-- ── 사이드바 ─────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
      <path d="M4 20l6-10h8l6 10H4z" fill="#4488ff" opacity=".9"/>
      <path d="M10 10L14 3l4 7H10z" fill="#22ddaa" opacity=".9"/>
      <path d="M16 10l6 10H22l-6-10z" fill="#ffaa33" opacity=".9"/>
    </svg>
    <span>hayul drive</span>
  </div>

  <!-- 새로 만들기 드롭다운 -->
  <div class="new-btn-wrap" id="new-btn-wrap">
    <button class="btn-new" id="btn-new">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      새로 만들기
      <svg class="chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="new-dropdown" id="new-dropdown">
      <button data-new="folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>새 폴더
      </button>
      <div class="dropdown-div"></div>
      <button data-new="doc">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>새 문서
      </button>
      <button data-new="sheet">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>새 스프레드시트
      </button>
      <button data-new="slide">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>새 프레젠테이션
      </button>
      <div class="dropdown-div"></div>
      <button data-new="upload">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>파일 업로드
      </button>
    </div>
  </div>

  <nav class="nav">
    <a class="nav-item" data-view="home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>홈
    </a>
    <a class="nav-item" data-view="my-drive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>내 드라이브
    </a>
    <a class="nav-item" data-view="shared">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>공유 문서함
    </a>
    <a class="nav-item" data-view="recent">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>최근 문서함
    </a>
    <a class="nav-item" data-view="starred">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>즐겨찾기
    </a>
    <a class="nav-item" data-view="trash">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>휴지통
    </a>
  </nav>

  <div class="sidebar-sep"></div>

  <div class="storage-box">
    <div class="storage-top">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      <span>저장 용량</span>
    </div>
    <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
    <div class="storage-nums"><span id="storage-used-text">0 B</span><span> / 15 GB</span></div>
    <button class="btn-upgrade">용량 추가</button>
  </div>
</aside>

<!-- ── 메인 ──────────────────────────────────────────────── -->
<main class="main">

  <!-- 상단 바 -->
  <header class="topbar">
    <button class="menu-btn" id="sidebar-toggle">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="드라이브에서 검색…" />
      <button class="search-clear" id="search-clear" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-view-toggle" title="보기 전환">
        <svg id="icon-grid" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <svg id="icon-list" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <div class="user-avatar">D</div>
    </div>
  </header>

  <!-- 콘텐츠 영역 -->
  <div class="content" id="content">

    <!-- 브레드크럼 -->
    <nav class="breadcrumb" id="breadcrumb" style="display:none">
      <span class="bc-root" id="bc-root">내 드라이브</span>
      <span class="bc-list" id="bc-list"></span>
    </nav>

    <!-- 섹션 헤더 -->
    <div class="section-header">
      <h2 id="section-title">홈</h2>
      <div id="trash-actions" style="display:none">
        <button class="btn-ghost btn-danger" id="btn-empty-trash">휴지통 비우기</button>
      </div>
    </div>

    <!-- ▸ 홈 뷰 -->
    <div id="view-home">
      <div class="home-block">
        <div class="home-block-title">최근 항목</div>
        <div class="recent-grid" id="recent-grid"></div>
        <div class="home-empty" id="recent-empty" style="display:none">최근 열어본 파일이 없습니다</div>
      </div>
      <div class="home-block">
        <div class="home-block-title">내 파일</div>
        <div class="file-grid" id="home-file-grid"></div>
      </div>
    </div>

    <!-- ▸ 파일 뷰 (my-drive / shared / recent / starred / trash / 폴더 내부) -->
    <div id="view-files" style="display:none">
      <div class="drop-zone" id="drop-zone">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
        <span>파일을 여기에 드롭하세요</span>
      </div>
      <!-- 리스트 뷰 헤더 -->
      <div class="list-header" id="list-header" style="display:none">
        <span class="lh-name">이름</span>
        <span class="lh-date">수정일</span>
        <span class="lh-size">크기</span>
      </div>
      <div class="file-grid" id="file-grid"></div>
      <div class="loading" id="loading" style="display:none"><div class="spinner"></div></div>
      <div class="empty-state" id="empty-state" style="display:none">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        <p>파일이 없습니다</p>
        <span id="empty-hint">새로 만들기 버튼으로 파일을 추가해 보세요</span>
      </div>
    </div>

  </div><!-- /content -->

  <input type="file" id="file-input" multiple style="display:none" />
</main>

<!-- ── 컨텍스트 메뉴 ──────────────────────────────────────── -->
<div class="ctx-menu" id="context-menu">
  <button data-action="open">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>열기
  </button>
  <button data-action="download">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>다운로드
  </button>
  <div class="ctx-div"></div>
  <button data-action="rename">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>이름 바꾸기
  </button>
  <button data-action="star">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span id="ctx-star-label">즐겨찾기 추가</span>
  </button>
  <button data-action="share">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>공유
  </button>
  <button data-action="copy">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>복사본 만들기
  </button>
  <div class="ctx-div"></div>
  <button data-action="trash" class="danger">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>휴지통으로 이동
  </button>
  <button data-action="restore" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>복원
  </button>
  <button data-action="delete" class="danger" style="display:none">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>영구 삭제
  </button>
</div>

<!-- ── 모달: 이름 변경 ──────────────────────────────────── -->
<div class="modal-overlay" id="modal-rename">
  <div class="modal">
    <h3>이름 바꾸기</h3>
    <input type="text" id="rename-input" class="modal-input" />
    <div class="modal-actions">
      <button class="btn-ghost" data-close="modal-rename">취소</button>
      <button class="btn-primary" id="btn-rename-confirm">변경</button>
    </div>
  </div>
</div>

<!-- ── 모달: 공유 ───────────────────────────────────────── -->
<div class="modal-overlay" id="modal-share">
  <div class="modal modal-wide">
    <h3>공유 설정</h3>
    <div class="share-row">
      <input type="text" id="share-link-input" class="modal-input" placeholder="링크 공유 활성화 후 링크가 생성됩니다" readonly />
      <button class="btn-primary" id="btn-copy-link">복사</button>
    </div>
    <label class="toggle-wrap">
      <input type="checkbox" id="chk-link-share" />
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span>링크 공유 허용</span>
    </label>
    <div class="share-row" style="margin-top:16px">
      <input type="email" id="share-email-input" class="modal-input" placeholder="이메일 주소" />
      <select id="share-role-select" class="modal-select">
        <option value="reader">보기</option>
        <option value="commenter">댓글</option>
        <option value="writer">편집</option>
      </select>
      <button class="btn-primary" id="btn-share-add">추가</button>
    </div>
    <div class="perm-list" id="perm-list"></div>
    <div class="modal-actions"><button class="btn-ghost" data-close="modal-share">닫기</button></div>
  </div>
</div>

<!-- ── 모달: 새 폴더 ────────────────────────────────────── -->
<div class="modal-overlay" id="modal-folder">
  <div class="modal">
    <h3>새 폴더 만들기</h3>
    <input type="text" id="folder-name-input" class="modal-input" value="새 폴더" />
    <div class="modal-actions">
      <button class="btn-ghost" data-close="modal-folder">취소</button>
      <button class="btn-primary" id="btn-folder-confirm">만들기</button>
    </div>
  </div>
</div>

<!-- ── 모달: 새 파일 ────────────────────────────────────── -->
<div class="modal-overlay" id="modal-newfile">
  <div class="modal">
    <h3 id="newfile-title">새 문서</h3>
    <input type="text" id="newfile-name-input" class="modal-input" />
    <div class="modal-actions">
      <button class="btn-ghost" data-close="modal-newfile">취소</button>
      <button class="btn-primary" id="btn-newfile-confirm">만들기</button>
    </div>
  </div>
</div>

<!-- ── 모달: 파일 미리보기 ──────────────────────────────── -->
<div class="modal-overlay" id="modal-preview">
  <div class="modal modal-preview">
    <div class="preview-header">
      <div class="preview-title">
        <span id="preview-icon-lg" style="font-size:22px"></span>
        <div>
          <div class="preview-name" id="preview-name"></div>
          <div class="preview-meta" id="preview-meta"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-ghost" id="preview-dl">다운로드</button>
        <button class="icon-btn" data-close="modal-preview">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="style/js/utils.js"></script>
<script src="style/js/toast.js"></script>
<script src="style/js/api.js"></script>
<script src="style/js/state.js"></script>
<script src="style/js/render.js"></script>
<script src="style/js/actions.js"></script>
<script src="style/js/upload.js"></script>
<script src="style/js/modals.js"></script>
<script src="style/js/context.js"></script>
<script src="style/js/app.js"></script>
</body>
</html>
